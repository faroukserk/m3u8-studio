[package]
name = "m3u8-studio"
version = "1.2.1"
edition = "2021"
description = "Minimal HLS/m3u8 downloader with a Slint UI and a browser-extension bridge"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
hex = "0.4"
url = "2"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
