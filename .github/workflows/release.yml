name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: linux-x86_64
          - os: macos-latest
            label: macos-arm64
            target: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
            target: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          name="m3u8-studio-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/m3u8-studio "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # The files are embedded in the binary, but shipping them as a folder
          # lets people load the extension manually if the app can't unpack it.
          cp -R extension "dist/${name}/extension"
          tar -czf "${name}.tar.gz" -C dist "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$ASSET" \
            || gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
