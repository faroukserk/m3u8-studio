name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary: m3u8-studio
            archive: tar.gz
          - os: ubuntu-latest
            label: linux-x86_64-musl
            target: linux-x86_64-musl
            rust_target: x86_64-unknown-linux-musl
            binary: m3u8-studio
            archive: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            binary: m3u8-studio
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            binary: m3u8-studio
            archive: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            binary: m3u8-studio
            archive: tar.gz
          - os: windows-latest
            label: windows-x86_64
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            binary: m3u8-studio.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          pkg_version="${version#v}"
          name="m3u8-studio-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # Ship the extension ready-to-load, with a matching version stamp so
          # the app doesn't need to rewrite it in a read-only install folder.
          cp -R extension "dist/${name}/extension"
          printf '%s' "$pkg_version" > "dist/${name}/extension/.installed-version"
          tar -czf "${name}.tar.gz" -C dist "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $pkgVersion = $version.TrimStart('v')
          $name = "m3u8-studio-$version-${{ matrix.target }}"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" $stage
          Copy-Item "README.md", "LICENSE" $stage
          Copy-Item -Recurse "extension" (Join-Path $stage "extension")
          Set-Content -NoNewline -Path (Join-Path $stage "extension\.installed-version") -Value $pkgVersion
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$ASSET" \
            || gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  extension:
    name: browser-extension (CRX + XPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp extension version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          printf '%s' "${version#v}" > extension/.installed-version

      - name: Restore CRX signing key
        env:
          CRX_KEY: ${{ secrets.M3U8_CRX_KEY }}
        shell: bash
        run: printf '%s' "$CRX_KEY" > /tmp/m3u8-studio.crx.pem

      - name: Build CRX (Chrome/Edge)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          npx --yes crx3@2.0.0 -o "m3u8-studio-${version}-extension.crx" \
            -p /tmp/m3u8-studio.crx.pem extension
          ls -lh *.crx

      - name: Build XPI (Firefox)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          rm -rf /tmp/m3u8-firefox-extension
          cp -R extension /tmp/m3u8-firefox-extension
          # Firefox/Safari use an event page, not Chrome's service worker.
          cp extension/manifest.firefox.json /tmp/m3u8-firefox-extension/manifest.json
          printf '%s' "${version#v}" > /tmp/m3u8-firefox-extension/.installed-version
          (cd /tmp/m3u8-firefox-extension && zip -r "$GITHUB_WORKSPACE/m3u8-studio-${version}-extension.xpi" .)
          ls -lh *.xpi

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: |
            *.crx
            *.xpi
          if-no-files-found: error

      - name: Attach extensions to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag *.crx *.xpi \
            || gh release upload "$GITHUB_REF_NAME" *.crx *.xpi --clobber
