name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # fontconfig is loaded at runtime; avoids cross-compiled pkg-config.
      RUST_FONTCONFIG_DLOPEN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary: m3u8-studio
            archive: tar.gz
          - os: ubuntu-latest
            label: linux-x86_64-musl
            target: linux-x86_64-musl
            rust_target: x86_64-unknown-linux-musl
            binary: m3u8-studio
            archive: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            binary: m3u8-studio
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            binary: m3u8-studio
            archive: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            binary: m3u8-studio
            archive: tar.gz
          - os: windows-latest
            label: windows-x86_64
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            binary: m3u8-studio.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual}"
          name="m3u8-studio-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # The files are embedded in the binary, but shipping them as a folder
          # lets people load the extension manually if the app can't unpack it.
          cp -R extension "dist/${name}/extension"
          tar -czf "${name}.tar.gz" -C dist "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $name = "m3u8-studio-$version-${{ matrix.target }}"
          $stage = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" $stage
          Copy-Item "README.md", "LICENSE" $stage
          Copy-Item -Recurse "extension" (Join-Path $stage "extension")
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$ASSET" \
            || gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
