<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>m3u8 studio</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28" />
      <div class="brand-text">
        <div class="name">m3u8 studio</div>
        <div class="tagline">Browser bridge</div>
      </div>
    </div>
    <div id="pill" class="pill checking" title="Desktop app connection">
      <span class="dot"></span>
      <span id="pillText">Checking</span>
    </div>
  </header>

  <main>
    <div class="page-row">
      <span id="pageHost" class="page-host">this page</span>
      <span id="appSummary" class="app-summary"></span>
    </div>

    <div class="hero">
      <button id="sendBest" class="primary" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4.2-4.2M12 15l-4.2-4.2M5 19.5h14"/></svg>
        <span id="sendBestText">Send best stream</span>
      </button>
      <button id="rescan" class="icon-button" title="Scan the page again" aria-label="Rescan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 12a7.6 7.6 0 1 1-2.2-5.3M19.8 4v4.2h-4.2"/></svg>
      </button>
    </div>

    <div class="section-head">
      <div class="section-title">
        <span>DETECTED</span>
        <span id="count" class="count">0</span>
      </div>
      <button id="sendAll" class="link" disabled>Send all</button>
    </div>

    <div id="list" class="list" role="list"></div>

    <div id="empty" class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6 18.6 12l-10.1 6.4z"/></svg>
      </div>
      <div class="empty-title">No streams yet</div>
      <div class="empty-text">Start the video, then rescan. HLS manifests are picked up from network traffic and the page itself.</div>
      <button id="emptyRescan" class="ghost">Rescan the page</button>
    </div>

    <div id="offline" class="notice hidden">
      <strong>Desktop app offline.</strong>
      <span>Start m3u8 studio and this popup will reconnect.</span>
      <button id="retry" class="link inline">Retry</button>
    </div>
  </main>

  <div class="support-row">
    <a href="https://ko-fi.com/H4D12AXINB" target="_blank" rel="noopener noreferrer"><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
  </div>

  <footer>
    <span class="footer-left"><span class="tiny-dot"></span> 127.0.0.1:37811</span>
    <span id="footerNote">Loopback only</span>
  </footer>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
